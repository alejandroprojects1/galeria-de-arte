<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria Virtual</title>
  <meta name="description" content="Mostra de Artes Visuais do 4º ano do Sesc Porto Seguro, Bahia.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css?v=8">
</head>
<body>
  <header class="barra">
    <a href="#" id="marca" class="marca"></a>
    <nav>
      <a href="index.html" aria-current="page">Obras</a>
      <a href="sobre.html">Sobre o projeto</a>
      <a href="agradecimentos.html">Agradecimentos</a>
    </nav>
  </header>

  <main>
    <section class="abertura">
      <p class="rotulo surgir">Exposição virtual · <span id="ano"></span></p>
      <h1 id="titulo" class="surgir"></h1>
      <dl class="ficha-expo surgir">
        <div><dt>Autoria</dt><dd id="autoria"></dd></div>
        <div><dt>Local</dt><dd id="local"></dd></div>
        <div><dt>Obras</dt><dd id="total"></dd></div>
        <div><dt>Projeto</dt><dd id="responsavel"></dd></div>
      </dl>
    </section>

    <section id="obras" class="obras" aria-label="Obras">
      <div id="grade" class="grade"></div>
    </section>

    <section id="projeto" class="projeto">
      <h2 id="projeto-nome" class="surgir"></h2>
      <div>
        <p id="projeto-descricao" class="projeto-texto surgir"></p>
        <a href="sobre.html" class="link-seta surgir">Ler sobre o projeto <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p id="rodape-texto"></p>
    <a href="#">Voltar ao topo ↑</a>
  </footer>

  <!-- Visualizador ampliado -->
  <div id="visor" class="visor" hidden role="dialog" aria-modal="true" aria-label="Obra ampliada">
    <div class="visor-topo">
      <span id="visor-numero" class="numero"></span>
      <button class="visor-fechar" type="button">Fechar <span aria-hidden="true">✕</span></button>
    </div>
    <figure class="visor-conteudo">
      <img id="visor-img" alt="">
      <figcaption>
        <h3 id="visor-titulo"></h3>
        <p id="visor-ficha" class="ficha"></p>
        <p id="visor-descricao"></p>
      </figcaption>
    </figure>
    <button class="visor-seta anterior" type="button" aria-label="Obra anterior">←</button>
    <button class="visor-seta proxima" type="button" aria-label="Próxima obra">→</button>
  </div>

  <script src="dados.js?v=8"></script>
  <script src="script.js?v=8"></script>
</body>
</html>
